[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "egowhale"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.17.1",
    "h5py==3.16.0",
    "opencv-python==4.11.0.86",
    "mujoco==3.13.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ray==2.58.0",
    "nvidia-curobo==0.8.0",
    "numpy-quaternion==2024.0.13",
    "warp-lang==1.17.0",
    "trimesh==5.1.0",
    "yourdfpy==0.0.60",
    "matplotlib==3.11.2",
    "safetensors==0.8.0",
    "einops==0.8.2",
    "addict==2.4.0",
    "omegaconf==2.3.1",
    "timm==1.0.29",
    "ftfy==6.1.1",
    "regex==2026.9.10",
    "iopath==0.1.10",
    "huggingface_hub==1.32.0",
    "tqdm==4.70.1",
    "pillow==12.3.0",
    "imageio==2.37.4",
    "imageio-ffmpeg==0.6.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["egowhale*"]
